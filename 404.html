<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website preview · DavDags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  /* One template for every preview; each niche only changes the colours and the heading font. */
  :root { --bg: #ffffff; --ink: #14161c; --muted: #5f6472; --soft: #f4f5f8; --accent: #1f4fd8; --accent-ink: #ffffff; --head: "Inter", system-ui, sans-serif; }
  body[data-niche="fashion"] { --accent: #111111; --soft: #f6f2ee; --head: "Playfair Display", Georgia, serif; }
  body[data-niche="food"] { --accent: #c2410c; --soft: #fff4ec; }
  body[data-niche="beauty"] { --accent: #7c3aed; --soft: #f5f1ff; --head: "Playfair Display", Georgia, serif; }
  body[data-niche="gadgets"] { --accent: #0f766e; --soft: #eef8f7; }
  body[data-niche="construction"] { --accent: #b45309; --soft: #fbf6ee; }
  body[data-niche="services"] { --accent: #1f4fd8; --soft: #eff4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 "Inter", system-ui, sans-serif; }
  a { color: inherit; }
  .bar { position: sticky; top: 0; z-index: 10; background: #0b1220; color: #fff; font-size: 13px; text-align: center; padding: 8px 12px; }
  .bar b { color: #7cb7ff; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; max-width: 1100px; margin: 0 auto; }
  header img { width: 48px; height: 48px; object-fit: contain; border-radius: 10px; background: var(--soft); }
  header .name { font: 800 20px/1.1 var(--head); }
  header .wa { margin-left: auto; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; padding: 11px 18px; border-radius: 999px; border: 0; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .hero { max-width: 1100px; margin: 0 auto; padding: 8px 20px 28px; display: grid; gap: 22px; align-items: center; }
  .hero h1 { font: 700 clamp(30px, 6vw, 52px)/1.08 var(--head); margin: 0 0 12px; }
  .hero p { color: var(--muted); margin: 0 0 20px; font-size: 17px; }
  .hero .pic { border-radius: 22px; overflow: hidden; background: var(--soft); aspect-ratio: 4/3; }
  .hero .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (min-width: 820px) { .hero { grid-template-columns: 1.05fr 1fr; padding-top: 30px; } }
  section { max-width: 1100px; margin: 0 auto; padding: 26px 20px; }
  h2 { font: 700 28px/1.2 var(--head); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
  .card { background: var(--soft); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .card .img { aspect-ratio: 1; background: #e9ebf0; }
  .card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .t { font-weight: 600; }
  .card .p { font-weight: 800; color: var(--accent); }
  .card .btn { margin-top: auto; justify-content: center; padding: 9px 12px; font-size: 14px; }
  .about { background: var(--soft); border-radius: 22px; padding: 26px; }
  .about p { color: var(--muted); margin: 0; font-size: 17px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 20px 90px; }
  .float { position: fixed; right: 16px; bottom: 16px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .msg { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); }
  .msg h1 { font: 800 26px/1.2 "Inter", sans-serif; color: var(--ink); }
</style>
</head>
<body>
<div id="root"><div class="msg"><p>Loading your preview…</p></div></div>
<script>
// Previews live at preview.davdags.com/<slug>. GitHub Pages serves this same file for every path (404.html).
const API = "https://soxevflmqepqbritrpnl.supabase.co/functions/v1/whatsapp/preview-data?slug=";
const OWNER_WA = "447446960862"; // the DavDags WhatsApp number, for "make it live"
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const waIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.7-2.8-1.1-4.6-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>`;

async function main() {
  const slug = location.pathname.replace(/^\/+|\/+$/g, "").split("/").pop() || new URLSearchParams(location.search).get("s") || "";
  const root = document.getElementById("root");
  if (!slug) { root.innerHTML = `<div class="msg"><div><h1>DavDags website previews</h1><p>Ask us on WhatsApp for your free preview.</p></div></div>`; return; }
  let d;
  try {
    const res = await fetch(API + encodeURIComponent(slug));
    d = await res.json();
    if (!res.ok) throw new Error(d.error || "not found");
  } catch {
    root.innerHTML = `<div class="msg"><div><h1>Preview not found</h1><p>This link may be mistyped. Message DavDags on WhatsApp for help.</p></div></div>`;
    return;
  }
  if (d.expired) {
    root.innerHTML = `<div class="msg"><div><h1>This preview has expired</h1><p>Message DavDags on WhatsApp to bring it back and put your website live.</p>
      <p><a class="btn" href="https://wa.me/${OWNER_WA}">${waIcon} Message DavDags</a></p></div></div>`;
    return;
  }
  document.body.dataset.niche = d.niche || "other";
  document.title = `${d.business_name} · preview`;
  const wa = (text) => `https://wa.me/${esc(d.whatsapp)}?text=${encodeURIComponent(text)}`;
  const products = (d.products || []).filter((p) => p.name);
  const heroImg = d.hero || products.find((p) => p.image)?.image || "";
  root.innerHTML = `
    <div class="bar">Preview by <b>DavDags</b> · this website isn't live yet ·
      <a href="https://wa.me/${OWNER_WA}?text=${encodeURIComponent(`Hi DavDags, I've seen my preview (${d.business_name}). I want to make it live.`)}"><b>Make it live →</b></a></div>
    <header>
      ${d.logo ? `<img src="${esc(d.logo)}" alt="">` : ""}
      <div class="name">${esc(d.business_name)}</div>
      <a class="btn wa" href="${wa(`Hi ${d.business_name}, I saw your website.`)}">${waIcon}<span>Chat</span></a>
    </header>
    <div class="hero">
      <div>
        <h1>${esc(d.tagline || d.business_name)}</h1>
        <p>${esc(d.location ? `${d.location} · ` : "")}Browse our products and order straight on WhatsApp.</p>
        <a class="btn" href="#shop">Shop now</a>
      </div>
      ${heroImg ? `<div class="pic"><img src="${esc(heroImg)}" alt=""></div>` : ""}
    </div>
    ${products.length ? `<section id="shop"><h2>Our products</h2><div class="grid">
      ${products.map((p) => `<div class="card">
        <div class="img">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : ""}</div>
        <div class="body"><div class="t">${esc(p.name)}</div>${p.price ? `<div class="p">${esc(p.price)}</div>` : ""}
          <a class="btn" href="${wa(`Hi ${d.business_name}, I'd like to order: ${p.name}${p.price ? ` (${p.price})` : ""}`)}">${waIcon} Order</a></div>
      </div>`).join("")}
    </div></section>` : ""}
    ${d.about ? `<section><div class="about"><h2>About us</h2><p>${esc(d.about)}</p></div></section>` : ""}
    <footer>© ${new Date().getFullYear()} ${esc(d.business_name)} · Website by DavDags</footer>
    <a class="btn float" href="${wa(`Hi ${d.business_name}, I'd like to order.`)}">${waIcon} Order on WhatsApp</a>`;
}
main();
</script>
</body>
</html>
